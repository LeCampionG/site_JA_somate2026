project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!README.md"
    - "!tasks/"

website:
  title: "SO-MATé 2026"
  description: "7èmes journées annuelles du réseau SO-MATé"
  site-url: "https://lecampiong.github.io/site_JA_somate2026/"
  favicon: images/logo-somate.png
  navbar:
    logo: images/logo-somate.png
    logo-alt: "Logo SO-MATé"
    title: false
    left:
      - text: "SO-MATé 2026"
        href: index.qmd
      - text: "Programme"
        href: programme.qmd
      - text: "Informations pratiques"
        href: infos-pratiques.qmd
      - text: "Inscription"
        href: inscription.qmd
  page-footer:
    left: |
      [Réseau SO-MATé](https://mate-shs.cnrs.fr/les-groupes/groupes-locaux/so-mate-mate-shs-sud-ouest-2/)
    right: |
      Visuel : [Karine Onfroy & Coordination So-Mate] — CC BY 4.0 · Site généré avec [Quarto](https://quarto.org)
  open-graph: true

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-title: "Sur cette page"
    lang: fr
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
